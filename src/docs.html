<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} · tsquare docs</title>
<link rel="icon" type="image/png" href="/mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/site.css">
<style>
  .layout { max-width: 1160px; margin: 0 auto; padding: 32px 20px 0; display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 40px; }
  .side { position: sticky; top: 84px; align-self: start; display: flex; flex-direction: column; gap: 2px; }
  .side .label { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px 10px; }
  .side a { color: var(--navy); text-decoration: none; padding: 7px 10px; border-radius: 8px; font-weight: 550; font-size: 15px; }
  .side a:hover { background: var(--mist); }
  .side a[aria-current="page"] { background: var(--sky); }
  article { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 36px 44px; min-width: 0; }
  article h1 { color: var(--navy); font-size: 34px; letter-spacing: -0.02em; margin: 0 0 16px; line-height: 1.15; }
  article h2 { color: var(--navy); font-size: 23px; margin: 36px 0 12px; letter-spacing: -0.01em; }
  article h3 { color: var(--navy); font-size: 18px; margin: 26px 0 10px; }
  article h2, article h3 { scroll-margin-top: 80px; }
  article p, article li { max-width: 74ch; }
  article img { max-width: min(100%, 640px); border-radius: 10px; border: 1px solid var(--line); background: #e6e8eb; display: block; margin: 16px 0; }
  article p > img:only-child { margin: 16px 0; }
  article table { border-collapse: collapse; width: 100%; font-size: 14.5px; margin: 16px 0; display: block; overflow-x: auto; }
  article th { text-align: left; color: var(--navy); background: #f3f9ff; }
  article th, article td { border: 1px solid var(--line); padding: 8px 12px; vertical-align: top; }
  article pre { font-size: 13px; }
  .edit { margin-top: 32px; font-size: 14px; color: var(--muted); }
  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; gap: 16px; padding-top: 16px; }
    .side { position: static; flex-direction: row; flex-wrap: wrap; }
    .side .label { display: none; }
    article { padding: 24px 20px; }
  }
</style>
</head>
<body>
<header class="site-header"><div class="inner">
  <a class="brand" href="/"><img src="/mark.png" alt="">tsquare</a>
  <nav>
    <a href="/docs" aria-current="page">Docs</a>
    <a href="/playground">Playground</a>
    <a class="icon" href="https://github.com/tsquare-js/tsquare" aria-label="tsquare on GitHub"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/></svg></a>
  </nav>
</div></header>
<div class="layout">
  <nav class="side" aria-label="Docs"><div class="label">Docs</div>{{NAV}}</nav>
  <article>
{{BODY}}
    <p class="edit">tsquare {{VERSION}} · <a href="{{SOURCE}}">View this page on GitHub</a></p>
  </article>
</div>
<footer class="site-footer"><div class="inner">
  <span>tsquare {{VERSION}} · MIT license</span>
  <span class="spacer"></span>
  <a href="https://github.com/tsquare-js/tsquare">GitHub</a>
  <a href="https://www.npmjs.com/package/tsquare">npm</a>
</div></footer>
</body>
</html>
